[package]
name = "recovery"
version = "0.1.0"
edition = "2021"
description = "Post-incident recovery, snapshot, reconciliation, and key-rotation tooling for LedgerLens"
repository = "https://github.com/ledgerlens/contract"
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
anyhow = "1.0"
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"
hex = "0.4"

[[bin]]
name = "recovery"
path = "src/main.rs"
