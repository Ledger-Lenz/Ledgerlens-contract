[package]
name = "ledgerlens-score"
version = "0.1.0"
edition = "2021"
publish = false
description = "On-chain risk score registry for LedgerLens"
repository = "https://github.com/ledgerlens/contract"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = "21.0.0"
subtle = { version = "2.6", default-features = false }
libm = "0.2"

[dev-dependencies]
soroban-sdk = { version = "21.0.0", features = ["testutils"] }
ledgerlens-test-support = { path = "../ledgerlens-test-support" }
# Used only by tests, to produce real secp256k1 ECDSA signatures that
# exercise `verify_attestation` end-to-end (see `test_attestation.rs`).
k256 = { version = "0.13.4", features = ["ecdsa"] }
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "batch_submit"
harness = false
path = "benches/batch_submit.rs"

[[bench]]
name = "batch_attested"
harness = false
path = "benches/batch_attested.rs"

[[bench]]
name = "rent_sweep"
harness = false
path = "benches/rent_sweep.rs"

[[bench]]
name = "history_eviction"
harness = false
path = "benches/history_eviction.rs"

[[bench]]
name = "batch_worst_case_profiles"
harness = false
path = "benches/batch_worst_case_profiles.rs"

[[bench]]
name = "get_delegation_chain"
harness = false
path = "benches/get_delegation_chain.rs"

[[bench]]
name = "reconcile_state"
harness = false
path = "benches/reconcile_state.rs"

[[bench]]
name = "estimate_unique_wallets"
harness = false
path = "benches/estimate_unique_wallets.rs"

[features]
testutils = ["soroban-sdk/testutils"]

# Reference integration showing how a third-party contract gates on a
# LedgerLens risk score. Built as a library (it is a Soroban contract, not a
# `fn main` binary) via: cargo build --example amm_gate -p ledgerlens-score
[[example]]
name = "amm_gate"
path = "../../examples/amm_gate.rs"
crate-type = ["lib"]

[[example]]
name = "amm_gate_example"
path = "../../examples/amm_gate_example.rs"
crate-type = ["lib"]

[[example]]
name = "typed_client_examples"
path = "../../examples/typed_client_examples.rs"
crate-type = ["lib"]
