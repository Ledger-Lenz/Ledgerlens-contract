SPECIFICATION Spec

CONSTANTS
    Wallets        = {"W1", "W2"}
    Scores         = {0, 50, 80}
    Assets         = {}
    COOLDOWN       = 1
    HWM_THRESHOLD  = 80
    FLOOR_VALUE    = 20
    RISK_THRESHOLD = 50
    \* Token-bucket bounds explored by TLC
    MIN_CAPACITY   = 1
    MAX_CAPACITY   = 3
    \* ── Governance constants ─────────────────────────────────────────────────
    \* GOV_EXEC_DELAY = 2: the proposal must age at least 2 ticks before
    \* execution. With now<=6 this exposes the before-delay (should fail),
    \* exactly-at-delay (boundary), and after-delay (success) cases.
    GOV_EXEC_DELAY  = 2
    \* GOV_PROPOSAL_TTL = 3: proposals expire 3 ticks after creation.
    \* With GOV_EXEC_DELAY=2 and now<=6 this produces the stale-but-not-yet-
    \* executable case (created at 1, executable at 3, expires at 4).
    GOV_PROPOSAL_TTL = 3
    \* Actions: two distinct action identifiers are sufficient to exercise
    \* proposal uniqueness and replacement flows.
    Actions        = {1, 2}
    \* ── Consensus bounds (issue #403) ────────────────────────────────────────
    Signers        = {"S1", "S2", "S3"}
    CONSENSUS_K    = 2
    CONSENSUS_EPSILON = 10
    REVEAL_WINDOW  = 2

INVARIANT
    HistoricalMaxMonotonicity
    EmbargoGateSoundness
    DelegationAcyclicity
    TokensNeverExceedCapacity
    TokensNonNegative
    CapacityReductionCapsNextBurst
    RefillAnchorNotInFuture
    CapacityWithinBounds
    \* Consensus invariants (issue #403)
    FinalScoreRequiresKReveals
    NoRevealWithoutCommit
    RevealOnlyWithinWindow
    FinalScoreWithinEpsilonOfCluster
    CommitTimestampNotInFuture
    ExpiredCommitCannotReveal
    \* Governance invariants (issue #1)
    NoEarlyExecution
    VetoBlocksExecution
    StaleProposalCannotExecute
    ReplacedProposalCannotExecute

PROPERTY
    BreachCounterStateMachine
    TokenExhaustionBlocksSubmit
    BurstNeverExceedsNewCapacity
    \* Consensus temporal properties (issue #403)
    FinalizationIsTerminalWithinRound
    FinalScoreImmutableWithinRound
    \* Governance temporal properties (issue #1)
    ExecutionIsTerminal
    VetoIsPermanent

CONSTRAINT
    StateConstraint
