SPECIFICATION Spec

CONSTANTS
    Wallets        = {"W1", "W2"}
    Scores         = {0, 50, 80}
    Assets         = {}
    COOLDOWN       = 1
    HWM_THRESHOLD  = 80
    FLOOR_VALUE    = 20
    RISK_THRESHOLD = 50
    \* Token-bucket bounds explored by TLC
    MIN_CAPACITY   = 1
    MAX_CAPACITY   = 3
    \* ── Consensus bounds (issue #403) ────────────────────────────────────────
    \* Signers: 3 model addresses give sufficient N-choose-K interleaving
    \* coverage while keeping the state space tractable.
    Signers        = {"S1", "S2", "S3"}
    \* CONSENSUS_K = 2: at least 2-of-3 signers must agree within epsilon.
    \* Covers the critical minority/majority boundary (K-1 agrees must fail).
    CONSENSUS_K    = 2
    \* CONSENSUS_EPSILON = 10: matches DEFAULT_CONSENSUS_EPSILON in constants.rs,
    \* and ensures Scores {0, 50, 80} produce both passing (50/50) and
    \* failing (0 vs 80) epsilon comparisons.
    CONSENSUS_EPSILON = 10
    \* REVEAL_WINDOW = 2: two time-ticks model the Soroban temporary-storage
    \* TTL (3600 s in production); using 2 with now<=5 exposes the
    \* within-window, exactly-at-boundary, and past-window cases.
    REVEAL_WINDOW  = 2

INVARIANT
    HistoricalMaxMonotonicity
    EmbargoGateSoundness
    DelegationAcyclicity
    TokensNeverExceedCapacity
    TokensNonNegative
    CapacityReductionCapsNextBurst
    RefillAnchorNotInFuture
    CapacityWithinBounds
    \* Consensus invariants (issue #403)
    FinalScoreRequiresKReveals
    NoRevealWithoutCommit
    RevealOnlyWithinWindow
    FinalScoreWithinEpsilonOfCluster
    CommitTimestampNotInFuture
    ExpiredCommitCannotReveal
    \* Liveness invariants (issue #753)
    SubmitEnabledWhenConditionsMet
    ScoreFloorDoesNotBlockAllScores

PROPERTY
    BreachCounterStateMachine
    TokenExhaustionBlocksSubmit
    BurstNeverExceedsNewCapacity
    \* Consensus temporal properties (issue #403)
    FinalizationIsTerminalWithinRound
    FinalScoreImmutableWithinRound
    \* Bounded liveness properties (issue #753)
    CooldownExpiryEnablesSubmission
    BoundedEmbargoEventuallyLifts
    BoundedLivenessSubmissionAccepted

CONSTRAINT
    StateConstraint
